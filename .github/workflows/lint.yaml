---
on:
  workflow_dispatch:
  # No path filters: these are required checks, and a filtered-out PR would never get them.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: lint
jobs:
  lint:
    timeout-minutes: 15
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install shellcheck

      - name: Lint
        run: make lint
