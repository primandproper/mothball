---
on:
  workflow_dispatch:
  # No path filters: these are required checks, and a filtered-out PR would never get them.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: build and test
jobs:
  ios:
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen

      - name: Swift version
        run: swift --version

      - name: Build
        run: make build

      - name: Test
        run: make test
